  <path d="M50 18.5 c-1.6-3.2-6.2-2.6-6.2 1 c0 2.8 3.4 4.8 6.2 7 c2.8-2.2 6.2-4.2 6.2-7 c0-3.6-4.6-4.2-6.2-1z" fill="#FF8F5A"/>
