{% extends "base.html" %}
{% block titulo %}Sin conexión{% endblock %}

{% block contenido %}
<div class="container my-5 text-center" style="max-width: 560px;">
  <span class="icono-circulo" style="width:72px;height:72px;font-size:2rem;"><i class="bi bi-cloud-slash"></i></span>
  <h1 class="titulo-pagina mt-3">No pudimos cargar la información</h1>

  <a href="{{ request.path }}" class="btn btn-naranja">Reintentar</a>
</div>
{% endblock %}
